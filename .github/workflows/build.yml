name: Build installers (Windows · macOS · Linux)

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: osu-collector-gui-windows-setup
          - os: macos-latest
            artifact: osu-collector-gui-macos-dmg
          - os: ubuntu-latest
            artifact: osu-collector-gui-linux-tarball

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      # The Linux build uses pywebview's self-contained Qt WebEngine backend
      # (bundles its own browser engine), so no system GTK/WebKit is needed —
      # that GTK stack is exactly what broke on rolling distros like Arch.

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Install backend extras (Linux Qt WebEngine)
        if: runner.os == 'Linux'
        run: pip install qtpy PyQt6 PyQt6-WebEngine

      - name: Install backend extras (macOS WebKit)
        if: runner.os == 'macOS'
        run: pip install pyobjc-framework-WebKit pyobjc-framework-Cocoa

      # ============================== WINDOWS ==============================
      - name: Build exe (Windows)
        if: runner.os == 'Windows'
        run: |
          # --onedir (not --onefile): the installer bundles the whole folder
          # into {app}, so there's no per-launch %TEMP%\_MEI extraction. That
          # extraction is what fails with "Failed to load Python DLL" when AV
          # quarantines a temp DLL or a CRT dependency isn't found there.
          pyinstaller --noconfirm --windowed --onedir `
            --name osu-collector-gui `
            --icon packaging/icon.ico `
            --add-data "web;web" `
            osu_collector_gui.py

      - name: Build installer (Windows / Inno Setup)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ver = (Select-String -Path osu_collector_gui.py `
            -Pattern 'APP_VERSION = "([^"]+)"').Matches[0].Groups[1].Value
          Write-Host "Version: $ver"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          # --- bundle installer dependencies (Collection Manager CLI + WebView2) ---
          New-Item -ItemType Directory -Force -Path deps\cm-cli | Out-Null
          Write-Host "Fetching Collection Manager CLI..."
          Invoke-WebRequest -UseBasicParsing -Uri "https://github.com/Piotrekol/CollectionManager/releases/latest/download/CollectionManager-CLI.zip" -OutFile deps\cm-cli.zip
          Expand-Archive -Path deps\cm-cli.zip -DestinationPath deps\cm-cli -Force
          Remove-Item deps\cm-cli\*.pdb -ErrorAction SilentlyContinue
          if (-not (Test-Path "deps\cm-cli\CollectionManager.App.Cli.exe")) { throw "CM CLI not unpacked" }
          Write-Host "Fetching Edge WebView2 bootstrapper..."
          Invoke-WebRequest -UseBasicParsing -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile deps\MicrosoftEdgeWebview2Setup.exe
          Write-Host "Fetching .NET 9 Desktop Runtime..."
          Invoke-WebRequest -UseBasicParsing -Uri "https://builds.dotnet.microsoft.com/dotnet/WindowsDesktop/9.0.17/windowsdesktop-runtime-9.0.17-win-x64.exe" -OutFile deps\windowsdesktop-runtime.exe
          & $iscc "/DAppVersion=$ver" packaging\windows-installer.iss
          if (-not (Test-Path "Output\osu-collector-gui-Setup.exe")) {
            throw "installer not produced"
          }

      # =============================== MACOS ===============================
      - name: Build app + dmg (macOS)
        if: runner.os == 'macOS'
        run: |
          pyinstaller --noconfirm --windowed \
            --name osu-collector-gui \
            --icon packaging/icon.icns \
            --add-data "web:web" \
            --osx-bundle-identifier com.r3d.osucollectorgui \
            osu_collector_gui.py
          test -d "dist/osu-collector-gui.app" || { echo "no .app"; exit 1; }
          # hdiutil intermittently fails with "Resource busy" when Spotlight /
          # diskarbitration is still touching the freshly-built .app. Retry.
          for attempt in 1 2 3 4 5; do
            if hdiutil create -volname "osu-collector-gui" \
                 -srcfolder "dist/osu-collector-gui.app" \
                 -ov -format UDZO "dist/osu-collector-gui.dmg"; then
              echo "dmg created (attempt $attempt)"; break
            fi
            if [ "$attempt" -eq 5 ]; then echo "hdiutil failed after 5 attempts"; exit 1; fi
            echo "hdiutil attempt $attempt failed (likely Resource busy) — retrying in 5s..."
            sleep 5
          done

      # =============================== LINUX ===============================
      - name: Build tarball (Linux)
        if: runner.os == 'Linux'
        run: |
          # --collect-all PyQt6 pulls in QtWebEngineProcess + its resources so
          # the self-contained web engine works from the extracted tarball.
          pyinstaller --noconfirm --windowed \
            --name osu-collector-gui \
            --add-data "web:web" \
            --collect-all PyQt6 \
            osu_collector_gui.py
          test -d "dist/osu-collector-gui" || { echo "no onedir build"; exit 1; }
          # A tiny top-level launcher so users double-click / run one file.
          cat > dist/osu-collector-gui/run.sh <<'SH'
          #!/usr/bin/env bash
          cd "$(dirname "$(readlink -f "$0")")" && exec ./osu-collector-gui "$@"
          SH
          chmod +x dist/osu-collector-gui/run.sh
          cp packaging/osu-collector-gui.desktop dist/osu-collector-gui/ 2>/dev/null || true
          cp packaging/icon-256.png dist/osu-collector-gui/icon.png 2>/dev/null || true
          tar -C dist -czf dist/osu-collector-gui-linux-x86_64.tar.gz osu-collector-gui
          test -f "dist/osu-collector-gui-linux-x86_64.tar.gz" || { echo "no tarball"; exit 1; }

      # ============================== UPLOAD ===============================
      - name: Upload (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: Output/osu-collector-gui-Setup.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/osu-collector-gui.dmg
          if-no-files-found: error
          retention-days: 30

      - name: Upload (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/osu-collector-gui-linux-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 30

      # ===================== RELEASE ON VERSION TAGS =======================
      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Output/osu-collector-gui-Setup.exe
            dist/osu-collector-gui.dmg
            dist/osu-collector-gui-linux-x86_64.tar.gz
          fail_on_unmatched_files: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
